name: Flutter CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  
jobs:
  test:

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Cache Pub Packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
            .dart_tool
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}
          restore-keys: |
            ${{ runner.os }}-pub-

      - run: flutter pub get

      - run: flutter analyze

      - run: flutter test

      # - name: Bump Version
      #   run: |
      #     chmod +x scripts/bump_version.sh
      #     ./scripts/bump_version.sh

      # - name: Commit Version
      #   run: |
      #     git config user.name github-actions
      #     git config user.email github-actions@github.com

      #     git add pubspec.yaml

      #     git commit -m "Auto bump build number [skip ci]" || true

      #     git push

      - run: flutter build web --release --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: flutter-web
          path: build/web

  docker:

    needs: test

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: acc4free9999/flutter-web-demo:latest