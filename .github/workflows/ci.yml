name: Flutter CI

on:
  push:
    branches:
      - main

  pull_request:

permissions:
  contents: write
  pages: write
  id-token: write
  
env:
  FLUTTER_VERSION: "stable"

jobs:

  analyze:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - run: flutter pub get

      - run: dart format --output=none --set-exit-if-changed .

      - run: flutter analyze

  test:

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - run: flutter pub get

      - run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/

  version:

    if: github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump Version
        run: |
          chmod +x scripts/bump_version.sh
          ./scripts/bump_version.sh

      - name: Commit Version
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add pubspec.yaml

          git commit -m "chore: bump build number [skip ci]" || true

      # Uncomment only after repository write permissions are configured.
      #
      # - name: Push
      #   run: |
      #     git push origin HEAD:${{ github.ref_name }}

  
  docker:

    needs:
      - analyze
      - test
      - version

    runs-on: ubuntu-latest

    steps:

      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: acc4free9999/flutter-web-demo:latest
  build:

    needs:
      - analyze
      - test
      - version

    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - uses: actions/cache@v4
        with:
          path: |
            ~/.pub-cache
          key: ${{ runner.os }}-pub-${{ hashFiles('**/pubspec.lock') }}

      - run: flutter pub get

      - run: flutter build web --release --dart-define=BUILD_NUMBER=${{ github.run_number }}

      - uses: actions/upload-artifact@v4
        with:
          name: web
          path: build/web

 